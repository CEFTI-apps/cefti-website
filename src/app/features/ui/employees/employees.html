<app-page-hero
  title="Notre Personnel"
  eyebrow="L'équipe CEFTI"
  subtitle="Des professionnels dédiés à la formation et à l'excellence académique."
  [breadcrumbs]="[{label: 'Accueil', link: '/home'}, {label: 'Personnel'}]"
/>

@for (dept of departments; track dept.dept; let i = $index) {
  <section class="dept-section" [class.alt]="i % 2 !== 0">
    <div class="dept-inner" revealOnScroll>

      <div class="dept-header">
        <span class="dept-eyebrow">{{ dept.dept }}</span>
        <h2>{{ dept.dept }}</h2>
      </div>

      <div class="members-grid" [class.direction-grid]="dept.dept === 'Direction'">
        @for (member of dept.members; track member.name) {
          <div class="member-card">
            <!--
              PHOTO : Pour afficher la vraie photo, remplacez le div.member-avatar ci-dessous par :
              <img class="member-photo" [src]="member.photo" [alt]="member.name" />
              Fichier à placer dans : public/assets/images/team/[prenom-nom].jpg
            -->
            <div class="member-avatar" [style.background]="dept.avatarBg">
              {{ member.initials }}
            </div>
            <div class="member-info">
              <h3 class="member-name">{{ member.name }}</h3>
              <p class="member-role">{{ member.role }}</p>
              <p class="member-bio">{{ member.bio }}</p>
            </div>
          </div>
        }
      </div>

    </div>
  </section>
}
